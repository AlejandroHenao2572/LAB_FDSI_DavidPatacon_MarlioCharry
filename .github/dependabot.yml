version: 2
updates:
  # Las únicas dependencias de terceros del proyecto son las GitHub Actions de los workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera 7 días antes de proponer una versión nueva: si se publica una versión comprometida, suele detectarse antes.
    cooldown:
      default-days: 7

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/muvautomation;
    index index.html;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Lab5 F-01: el sitio no usa scripts, estilos ni frames -> CSP restrictiva.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    autoindex off;
    location ~ /\. { deny all; }

    location / { try_files $uri $uri/ =404; }
}
